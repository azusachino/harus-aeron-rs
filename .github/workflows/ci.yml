name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IN_NIX_SHELL: "1" # skip the Makefile's `nix develop --command` wrapper; tools installed directly below

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install prettier
        run: npm install -g prettier

      - uses: oven-sh/setup-bun@v2

      - name: Install documentation dependencies
        run: bun install --frozen-lockfile

      - run: make check

      - name: Build Astro documentation site
        run: make docs-build

      - name: Build tutorial learner-stub workspace
        run: make tutorial-check

      - name: Test-parity report (informational)
        run: make test-parity

      - name: Rust client to Rust driver interop
        run: make interop-rust-smoke

      - name: Java and Rust driver interop
        run: make interop-smoke

      - name: Agrona loom interleaving checks
        run: RUSTFLAGS="--cfg loom" cargo test -p agrona --lib
