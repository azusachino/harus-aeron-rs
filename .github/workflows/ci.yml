name: CI

# Pull requests and manual runs: a merge to main re-ran the check its pull
# request had just passed. The weekly run on main keeps the Rust and Bun caches
# that pull requests restore from alive. Markdown stays in: the gates check docs.
on:
  pull_request:
  schedule:
    - cron: "0 18 * * 0" # Monday 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Show selected Rust toolchain
        run: mise exec -- rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests restore main's cache; only main writes it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: make setup

      - run: make check

      - name: Build Astro documentation site
        run: make astro-build

      - name: Test-parity report (informational)
        run: make test-parity

      - name: Rust client to Rust driver interop
        run: make interop-rust-smoke

      - name: Java and Rust driver interop
        run: make interop-smoke

      - name: Agrona loom interleaving checks
        run: mise exec -- env RUSTFLAGS="--cfg loom" cargo test -p agrona --lib
