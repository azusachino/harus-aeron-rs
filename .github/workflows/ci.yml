name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5

      - name: Show selected Rust toolchain
        run: mise exec -- rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install locked dependencies
        run: make setup

      - run: make check

      - name: Build Astro documentation site
        run: make astro-build

      - name: Build tutorial learner-stub workspace
        run: make tutorial-check

      - name: Test-parity report (informational)
        run: make test-parity

      - name: Rust client to Rust driver interop
        run: make interop-rust-smoke

      - name: Java and Rust driver interop
        run: make interop-smoke

      - name: Agrona loom interleaving checks
        run: mise exec -- env RUSTFLAGS="--cfg loom" cargo test -p agrona --lib
