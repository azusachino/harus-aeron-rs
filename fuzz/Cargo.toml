[package]
name = "harus-aeron-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
agrona = { path = "../crates/agrona" }
aeron-client = { path = "../crates/client" }
libfuzzer-sys = "0.4"

# Keep this package outside the main workspace. `cargo fuzz` owns its build flags.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false

[[bin]]
name = "uri_parse"
path = "fuzz_targets/uri_parse.rs"
test = false
doc = false

[[bin]]
name = "ring_buffer_read"
path = "fuzz_targets/ring_buffer_read.rs"
test = false
doc = false

[[bin]]
name = "log_buffer_read"
path = "fuzz_targets/log_buffer_read.rs"
test = false
doc = false
