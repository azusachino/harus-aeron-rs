site_name: Aeron in Rust
site_description: Build a wire-compatible Aeron implementation while learning Rust systems programming.
site_url: https://harus-aeron-rs.local/
repo_url: https://github.com/azusachino/harus-aeron-rs
repo_name: harus-aeron-rs
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/radio-tower
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang: en
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        tutorial/index.md: tutorial/README.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aeron-io/aeron
      name: Upstream Aeron

nav:
  - Home: index.md
  - Tutorial:
      - Overview: tutorial/README.md
      - Foundations:
          - Agrona Core: tutorial/01-agrona-core.md
          - Client Wire Protocol: tutorial/02-client-wire-protocol.md
          - Client Publication and Subscription: tutorial/03-client-pub-sub.md
          - Client Conductor: tutorial/04-client-conductor.md
      - Media Driver:
          - Configuration: tutorial/05-driver-configuration.md
          - UDP Channels: tutorial/06-driver-udp-channel.md
          - Transport Endpoints: tutorial/07-driver-transport-endpoints.md
          - Agents and Conductor: tutorial/08-driver-agents-conductor.md
      - Integration:
          - System Tests and Java Interop: tutorial/09-system-tests.md
      - Archive:
          - Codecs, Catalog, and Conductor: tutorial/10-archive-codecs-catalog.md
      - Cluster:
          - Raft Consensus and Failover: tutorial/11-cluster-consensus-failover.md
  - Architecture:
      - Overview: guides/architecture.md
  - Verification:
      - Java Interop Soak: interop-soak.md
      - Driver Parity Boundaries: driver-parity-boundaries.md
      - Cluster Failover Comparison: cluster-failover-comparison.md
      - Cluster Parity Boundaries: cluster-parity-boundaries.md
      - System-Test Parity Boundaries: system-test-parity-boundaries.md
      - Fuzzing: fuzzing.md
  - Roadmap: plan.md
  - Specifications:
      - Archive SBE Control Framing: specs/2026-07-29-archive-sbe-control-framing.md
