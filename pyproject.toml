[project]
name = "harus-aeron-rs-scripts"
version = "0.1.0"
description = "Orchestration/reporting tooling for harus-aeron-rs (scripts/ use PEP 723 inline deps via `uv run --script`; this project marker just pins the interpreter and dev tooling)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
