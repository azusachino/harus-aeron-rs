[project]
name = "harus-aeron-rs-scripts"
version = "0.1.0"
description = "Orchestration, reporting, and documentation tooling for harus-aeron-rs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "mkdocs-git-revision-date-localized-plugin>=1.4.7",
  "mkdocs-material>=9.6.20,<10",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-redirects>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
