[project]
name = "harus-aeron-rs-scripts"
version = "0.1.0"
description = "Orchestration, reporting, and documentation tooling for harus-aeron-rs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py315"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
